kind = "mobile"
previewPath = "/"
title = "Dame Pon"
description = "Aplicación móvil de transporte estilo Uber para pasajeros y conductores, conectada a un proyecto Supabase existente con autenticación y perfiles por rol."
version = "1.0.0"
id = "artifacts/dame-pon"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 22076

[services.development]
run = "pnpm --filter @workspace/dame-pon run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dame-pon", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/dame-pon", "run", "serve" ]

[services.env]
PORT = "22076"
BASE_PATH = "/"
