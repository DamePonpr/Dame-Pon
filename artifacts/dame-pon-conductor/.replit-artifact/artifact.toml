kind = "mobile"
previewPath = "/dame-pon-conductor/"
title = "Dame Pon Conductor"
description = "App móvil de conductores para completar el registro, gestionar disponibilidad y atender viajes municipales."
version = "1.0.0"
id = "artifacts/dame-pon-conductor"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/dame-pon-conductor/" ]
localPort = 22701

[services.development]
run = "pnpm --filter @workspace/dame-pon-conductor run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dame-pon-conductor", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/dame-pon-conductor", "run", "serve" ]

[services.env]
PORT = "22701"
BASE_PATH = "/dame-pon-conductor/"
