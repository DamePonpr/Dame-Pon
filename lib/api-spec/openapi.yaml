openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /admin/config:
    get:
      operationId: getAdminConfig
      tags: [admin]
      responses:
        "200":
          description: Configuración pública; nunca una llave privada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminConfig" }
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [admin]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Administrador verificado nuevamente por RPC
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Conteos operativos, sin GPS ni pagos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }
  /admin/assignees:
    get:
      operationId: getAdminAssignees
      tags: [admin]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Administradores existentes a quienes asignar casos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminAssignee" }
  /admin/records:
    get:
      operationId: getAdminRecords
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: section, in: query, required: true, schema: { $ref: "#/components/schemas/AdminSection" } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: Página acotada de registros mínimos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPage" }
  /admin/records/{section}/{id}:
    get:
      operationId: getAdminDetail
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: section, in: path, required: true, schema: { $ref: "#/components/schemas/AdminSection" } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Registro, metadatos documentales y auditoría; sin rutas Storage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDetail" }
  /admin/actions:
    post:
      operationId: runAdminAction
      tags: [admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminActionInput" }
      responses:
        "200":
          description: Transición atómica auditada; idempotente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminActionResult" }
  /admin/documents/open:
    post:
      operationId: openAdminDocument
      tags: [admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminDocumentInput" }
      responses:
        "200":
          description: Enlace privado, auditado, máximo 60 segundos; no persistir
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDocumentLink" }
  /quotes:
    post:
      operationId: createRideQuote
      tags: [quotes]
      security: [{ bearerAuth: [] }]
      summary: Cotización fija autoritativa, sin cobro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteDraftInput"
      responses:
        "200":
          description: Cotización propia persistida; no se ha creado viaje ni cobrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideQuote"
        "503":
          description: Compuerta apagada, configuración incompleta o sin regla comercial aprobada
  /quotes/confirm:
    post:
      operationId: confirmRideQuote
      tags: [quotes]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteConfirmationInput"
      responses:
        "200":
          description: Creación o recuperación idempotente del mismo viaje
          content:
            application/json:
              schema:
                type: object
                required: [tripId]
                properties:
                  tripId: { type: string, format: uuid }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    AdminConfig:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        supabaseUrl: { type: string }
        publishableKey: { type: string }
    AdminSession:
      type: object
      required: [actorId, role, schemaVersion]
      properties:
        actorId: { type: string, format: uuid }
        role: { type: string, enum: [admin] }
        schemaVersion: { type: string, enum: [phase5-v1] }
    AdminOverview:
      type: object
      required: [driversPending, incidentsOpen, supportOpen, tripsActive, asOf]
      properties:
        driversPending: { type: integer, minimum: 0 }
        incidentsOpen: { type: integer, minimum: 0 }
        supportOpen: { type: integer, minimum: 0 }
        tripsActive: { type: integer, minimum: 0 }
        asOf: { type: string }
    AdminAssignee:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    AdminSection:
      type: string
      enum: [drivers, vehicles, incidents, support, trips, pricing]
    AdminRecord:
      type: object
      required: [id, title, status, revision]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        status: { type: string }
        revision: { type: integer, minimum: 0 }
        secondary: { type: string }
        assigneeId: { type: [string, "null"], format: uuid }
        metadata: { type: object, additionalProperties: { type: string } }
    AdminPage:
      type: object
      required: [items, total, offset, limit]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminRecord" } }
        total: { type: integer, minimum: 0 }
        offset: { type: integer }
        limit: { type: integer }
    AdminDocument:
      type: object
      required: [id, kind, type, status, revision]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [driver, vehicle] }
        type: { type: string }
        status: { type: string }
        revision: { type: integer, minimum: 0 }
        expiresOn: { type: [string, "null"] }
    AdminAuditEvent:
      type: object
      required: [id, actorId, action, reason, createdAt]
      properties:
        id: { type: string, format: uuid }
        actorId: { type: string, format: uuid }
        action: { type: string }
        reason: { type: string }
        createdAt: { type: string }
        fromStatus: { type: string }
        toStatus: { type: string }
    AdminDetail:
      type: object
      required: [record, documents, events]
      properties:
        record: { $ref: "#/components/schemas/AdminRecord" }
        documents: { type: array, items: { $ref: "#/components/schemas/AdminDocument" } }
        events: { type: array, items: { $ref: "#/components/schemas/AdminAuditEvent" } }
    AdminActionInput:
      type: object
      additionalProperties: false
      required: [section, recordId, action, reason, expectedRevision, idempotencyKey]
      properties:
        section: { type: string, enum: [drivers, vehicles, incidents, support, documents] }
        recordId: { type: string, format: uuid }
        action: { type: string, enum: [approve, reject, suspend, activate, out_of_service, retire, triage, review, resolve, close, reopen, assign] }
        reason: { type: string, minLength: 10, maxLength: 1000 }
        expectedRevision: { type: integer, minimum: 0 }
        idempotencyKey: { type: string, format: uuid }
        documentKind: { type: string, enum: [driver, vehicle] }
        assigneeId: { type: [string, "null"], format: uuid }
    AdminActionResult:
      type: object
      required: [recordId, auditId]
      properties:
        recordId: { type: string, format: uuid }
        auditId: { type: string, format: uuid }
    AdminDocumentInput:
      type: object
      additionalProperties: false
      required: [id, kind, reason, expectedRevision, idempotencyKey]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [driver, vehicle] }
        reason: { type: string, minLength: 10, maxLength: 1000 }
        expectedRevision: { type: integer, minimum: 0 }
        idempotencyKey: { type: string, format: uuid }
    AdminDocumentLink:
      type: object
      required: [url, expiresAt]
      properties:
        url: { type: string }
        expiresAt: { type: string }
    QuotePoint:
      type: object
      additionalProperties: false
      required: [latitude, longitude, address]
      properties:
        latitude: { type: number, minimum: 17.8, maximum: 18.6 }
        longitude: { type: number, minimum: -68, maximum: -65.1 }
        address: { type: string, minLength: 3, maxLength: 300 }
    QuoteDraftInput:
      type: object
      additionalProperties: false
      required: [origin, destination, vehicleType]
      properties:
        origin: { $ref: "#/components/schemas/QuotePoint" }
        destination: { $ref: "#/components/schemas/QuotePoint" }
        vehicleType: { type: string, enum: [sedan] }
    QuoteConfirmationInput:
      type: object
      additionalProperties: false
      required: [quoteId, idempotencyKey]
      properties:
        quoteId: { type: string, format: uuid }
        idempotencyKey: { type: string, format: uuid }
    RideQuote:
      type: object
      required: [id, currency, totalCents, origin, destination, vehicleType, expiresAt, serverTime, ruleVersionId, policyVersion, distanceMm, durationMs, breakdown]
      properties:
        id: { type: string, format: uuid }
        currency: { type: string, enum: [USD] }
        totalCents: { type: integer, minimum: 0, maximum: 99999999 }
        origin: { $ref: "#/components/schemas/QuotePoint" }
        destination: { $ref: "#/components/schemas/QuotePoint" }
        vehicleType: { type: string, enum: [sedan] }
        expiresAt: { type: string }
        serverTime: { type: string }
        ruleVersionId: { type: string, format: uuid }
        policyVersion: { type: string, enum: [fixed-route-v1] }
        distanceMm: { type: integer, minimum: 1, maximum: 700000000 }
        durationMs: { type: integer, minimum: 1, maximum: 86400000 }
        breakdown: { type: object, additionalProperties: true }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

