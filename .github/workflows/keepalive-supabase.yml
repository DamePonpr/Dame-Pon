name: Keep Supabase active

on:
  schedule:
    - cron: "0 11 */2 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    name: Verify public Supabase API activity
    runs-on: ubuntu-latest
    env:
      SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check Supabase REST and Auth endpoints
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_ANON_KEY:-}" ]]; then
            echo "::error::Missing GitHub repository variable EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY."
            exit 1
          fi

          check_http_200() {
            local endpoint_name="$1"
            local url="$2"
            local response_file
            local curl_error_file
            local http_code
            local curl_status

            response_file="$(mktemp)"
            curl_error_file="$(mktemp)"

            if http_code="$(curl -fsS --retry 2 --retry-delay 5 \
              --output "$response_file" \
              --write-out '%{http_code}' \
              "$url" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              2>"$curl_error_file")"; then
              curl_status=0
            else
              curl_status=$?
            fi

            if [[ "$curl_status" -ne 0 || "$http_code" != "200" ]]; then
              echo "::error::${endpoint_name} failed: expected HTTP 200, received ${http_code:-no HTTP status} (curl exit ${curl_status})."
              if [[ -s "$curl_error_file" ]]; then
                cat "$curl_error_file"
              fi
              rm -f "$response_file" "$curl_error_file"
              return 1
            fi

            echo "${endpoint_name}: HTTP ${http_code}"
            rm -f "$response_file" "$curl_error_file"
          }

          record_keepalive_ping() {
            local response_file
            local curl_error_file
            local http_code
            local curl_status
            local row

            response_file="$(mktemp)"
            curl_error_file="$(mktemp)"

            if http_code="$(curl -fsS --retry 2 --retry-delay 5 \
              --request POST \
              --output "$response_file" \
              --write-out '%{http_code}' \
              "https://byexltskjqrorbfspshe.supabase.co/rest/v1/rpc/record_keepalive_ping" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=representation" \
              --data '{}' \
              2>"$curl_error_file")"; then
              curl_status=0
            else
              curl_status=$?
            fi

            if [[ "$curl_status" -ne 0 || "$http_code" != "200" ]]; then
              echo "::error::Supabase keepalive RPC failed: expected HTTP 200, received ${http_code:-no HTTP status} (curl exit ${curl_status})."
              if [[ -s "$curl_error_file" ]]; then
                cat "$curl_error_file"
              fi
              rm -f "$response_file" "$curl_error_file"
              return 1
            fi

            if ! row="$(jq -er 'select(type == "array" and length == 1) | .[0] | select(.id != null and .creado_en != null) | [.id, .creado_en] | @tsv' "$response_file")"; then
              echo "::error::Supabase keepalive RPC returned HTTP 200 without a ping record."
              rm -f "$response_file" "$curl_error_file"
              return 1
            fi

            echo "Supabase keepalive RPC: HTTP ${http_code}; latest row ${row}"
            rm -f "$response_file" "$curl_error_file"
          }

          record_keepalive_ping
          check_http_200 "Supabase REST keepalive" \
            "https://byexltskjqrorbfspshe.supabase.co/rest/v1/keepalive_ping?select=id&limit=1"
          check_http_200 "Supabase Auth settings" \
            "https://byexltskjqrorbfspshe.supabase.co/auth/v1/settings"