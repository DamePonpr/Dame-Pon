name: Dame Pon Android APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_dir: artifacts/dame-pon-pasajero
            role: pasajero
            label: Pasajero
          - app_dir: artifacts/dame-pon-conductor
            role: conductor
            label: Conductor

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Load public production variables
        working-directory: ${{ matrix.app_dir }}
        run: |
          grep -v '^[[:space:]]*#' .env.production >> "$GITHUB_ENV"

      - name: Set build metadata
        run: |
          case "$(date -u +%m)" in
            01) month="ene" ;;
            02) month="feb" ;;
            03) month="mar" ;;
            04) month="abr" ;;
            05) month="may" ;;
            06) month="jun" ;;
            07) month="jul" ;;
            08) month="ago" ;;
            09) month="sep" ;;
            10) month="oct" ;;
            11) month="nov" ;;
            12) month="dic" ;;
          esac
          {
            echo "EXPO_PUBLIC_BUILD_TAG=preview-${{ matrix.role }}-${GITHUB_RUN_NUMBER}"
            echo "EXPO_PUBLIC_BUILD_SHA=${GITHUB_SHA:0:7}"
            echo "EXPO_PUBLIC_BUILD_DATE=$(date -u +%-d) ${month} $(date -u +%Y)"
          } >> "$GITHUB_ENV"

      - name: Export public config for Metro and Gradle
        run: |
          test -n "${EXPO_PUBLIC_DOMAIN:-}"
          test -n "${EXPO_PUBLIC_SUPABASE_URL:-}"
          test -n "${EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}"
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY}" >> "$GITHUB_ENV"

      - name: Validate public Supabase configuration
        working-directory: ${{ matrix.app_dir }}
        run: pnpm run verify:supabase-config

      - name: Generate Android project
        working-directory: ${{ matrix.app_dir }}
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Copy preview signing keystore
        working-directory: ${{ matrix.app_dir }}
        run: cp android-signing/dame-pon-preview.keystore android/app/dame-pon-preview.keystore

      - name: Patch legacy clipboard repository declaration
        run: |
          clipboard_gradle="$(find node_modules/.pnpm -path '*/node_modules/@react-native-community/clipboard/android/build.gradle' -print -quit)"
          test -n "$clipboard_gradle"
          sed -i 's/jcenter()/mavenCentral()/g' "$clipboard_gradle"

      - name: Patch legacy clipboard React Native API
        run: |
          clipboard_java="$(find node_modules/.pnpm -path '*/node_modules/@react-native-community/clipboard/android/src/main/java/com/reactnativecommunity/clipboard/ClipboardModule.java' -print -quit)"
          test -n "$clipboard_java"
          sed -i \
            -e 's/import com.facebook.react.bridge.ContextBaseJavaModule;/import com.facebook.react.bridge.ReactContextBaseJavaModule;/' \
            -e '/import com.facebook.react.bridge.ReactMethod;/i import com.facebook.react.bridge.ReactApplicationContext;' \
            -e 's/extends ContextBaseJavaModule/extends ReactContextBaseJavaModule/' \
            -e 's/public ClipboardModule(Context context)/public ClipboardModule(ReactApplicationContext context)/' \
            -e 's/getContext()/getReactApplicationContext()/g' \
            "$clipboard_java"

      - name: Assemble release APK
        working-directory: ${{ matrix.app_dir }}/android
        run: |
          test -n "${EXPO_PUBLIC_DOMAIN:-}"
          test -n "${EXPO_PUBLIC_SUPABASE_URL:-}"
          test -n "${EXPO_PUBLIC_SUPABASE_ANON_KEY:-}"
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK to this workflow run
        uses: actions/upload-artifact@v4
        with:
          name: dame-pon-${{ matrix.role }}-preview-${{ github.run_number }}
          path: ${{ matrix.app_dir }}/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="preview-${{ matrix.role }}-${{ github.run_number }}"
          gh release create "$tag" \
            "${{ matrix.app_dir }}/android/app/build/outputs/apk/release/app-release.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Dame Pon ${{ matrix.label }} Android preview ${{ github.run_number }}" \
            --notes "APK de prueba generado por GitHub Actions para la app ${{ matrix.label }}."