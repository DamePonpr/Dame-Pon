name: Dame Pon Android APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_dir: artifacts/dame-pon-pasajero
            role: pasajero
            label: Pasajero
          - app_dir: artifacts/dame-pon-conductor
            role: conductor
            label: Conductor

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Load public production variables
        working-directory: ${{ matrix.app_dir }}
        run: |
          grep -v '^[[:space:]]*#' .env.production >> "$GITHUB_ENV"

      - name: Set build metadata
        run: |
          case "$(date -u +%m)" in
            01) month="ene" ;;
            02) month="feb" ;;
            03) month="mar" ;;
            04) month="abr" ;;
            05) month="may" ;;
            06) month="jun" ;;
            07) month="jul" ;;
            08) month="ago" ;;
            09) month="sep" ;;
            10) month="oct" ;;
            11) month="nov" ;;
            12) month="dic" ;;
          esac
          {
            echo "EXPO_PUBLIC_BUILD_TAG=preview-${{ matrix.role }}-${GITHUB_RUN_NUMBER}"
            echo "EXPO_PUBLIC_BUILD_SHA=${GITHUB_SHA:0:7}"
            echo "EXPO_PUBLIC_BUILD_DATE=$(date -u +%-d) ${month} $(date -u +%Y)"
          } >> "$GITHUB_ENV"

      - name: Export public config for Metro and Gradle
        run: |
          test -n "${EXPO_PUBLIC_DOMAIN:-}"
          test -n "${EXPO_PUBLIC_SUPABASE_URL:-}"
          test -n "${EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}"
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY}" >> "$GITHUB_ENV"

      - name: Validate public Supabase configuration
        working-directory: ${{ matrix.app_dir }}
        run: pnpm run verify:supabase-config

      - name: Generate Android project
        working-directory: ${{ matrix.app_dir }}
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Copy preview signing keystore
        working-directory: ${{ matrix.app_dir }}
        run: cp android-signing/dame-pon-preview.keystore android/app/dame-pon-preview.keystore

      - name: Patch legacy clipboard repository declaration
        run: |
          clipboard_gradle="$(find node_modules/.pnpm -path '*/node_modules/@react-native-community/clipboard/android/build.gradle' -print -quit)"
          test -n "$clipboard_gradle"
          sed -i 's/jcenter()/mavenCentral()/g' "$clipboard_gradle"

      - name: Patch legacy clipboard React Native API
        run: |
          clipboard_java="$(find node_modules/.pnpm -path '*/node_modules/@react-native-community/clipboard/android/src/main/java/com/reactnativecommunity/clipboard/ClipboardModule.java' -print -quit)"
          test -n "$clipboard_java"
          sed -i \
            -e 's/import com.facebook.react.bridge.ContextBaseJavaModule;/import com.facebook.react.bridge.ReactContextBaseJavaModule;/' \
            -e '/import com.facebook.react.bridge.ReactMethod;/i import com.facebook.react.bridge.ReactApplicationContext;' \
            -e 's/extends ContextBaseJavaModule/extends ReactContextBaseJavaModule/' \
            -e 's/public ClipboardModule(Context context)/public ClipboardModule(ReactApplicationContext context)/' \
            -e 's/getContext()/getReactApplicationContext()/g' \
            "$clipboard_java"

      - name: Assemble release APK
        working-directory: ${{ matrix.app_dir }}/android
        run: |
          test -n "${EXPO_PUBLIC_DOMAIN:-}"
          test -n "${EXPO_PUBLIC_SUPABASE_URL:-}"
          test -n "${EXPO_PUBLIC_SUPABASE_ANON_KEY:-}"
          chmod +x gradlew
          ./gradlew \
            --no-daemon \
            --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            assembleRelease

      - name: Validate APK identity and preview certificate
        env:
          EXPECTED_CERT_SHA256: fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c
        run: |
          case "${{ matrix.role }}" in
            pasajero) expected_package="com.damepon.damepon" ;;
            conductor) expected_package="com.damepon.conductor" ;;
            *) echo "Unknown app role: ${{ matrix.role }}" >&2; exit 1 ;;
          esac
          apk="${{ matrix.app_dir }}/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$aapt"
          test -n "$apksigner"

          badging="$("$aapt" dump badging "$apk")"
          package_line="$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)' versionCode='\([^']*\)' versionName='\([^']*\)'.*/\1 \2 \3/p")"
          test -n "$package_line"
          read -r actual_package actual_version_code actual_version_name <<< "$package_line"
          expected_version_code="${GITHUB_RUN_NUMBER}"
          expected_version_name="1.0.${GITHUB_RUN_NUMBER}"
          test "$actual_package" = "$expected_package"
          test "$actual_version_code" = "$expected_version_code"
          test "$actual_version_name" = "$expected_version_name"

          cert_output="$("$apksigner" verify --print-certs "$apk" 2>&1)"
          cert_sha256="$(printf '%s\n' "$cert_output" | sed -n 's/.*SHA-256 digest: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]' | head -n 1)"
          test -n "$cert_sha256"
          test "$cert_sha256" = "$EXPECTED_CERT_SHA256"

          {
            echo "APK validation for ${{ matrix.role }}:"
            echo "  package: $actual_package"
            echo "  versionCode: $actual_version_code"
            echo "  versionName: $actual_version_name"
            echo "  certificate SHA-256: $cert_sha256"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload APK to this workflow run
        uses: actions/upload-artifact@v4
        with:
          name: dame-pon-${{ matrix.role }}-preview-${{ github.run_number }}
          path: ${{ matrix.app_dir }}/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create combined Android preview release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dame-pon-*-preview-${{ github.run_number }}
          path: release-assets
          merge-multiple: false

      - name: Create GitHub Release with both APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pasajero="release-assets/dame-pon-pasajero-preview-${{ github.run_number }}/app-release.apk"
          conductor="release-assets/dame-pon-conductor-preview-${{ github.run_number }}/app-release.apk"
          test -f "$pasajero"
          test -f "$conductor"
          mv "$pasajero" "release-assets/dame-pon-pasajero-preview-${{ github.run_number }}.apk"
          mv "$conductor" "release-assets/dame-pon-conductor-preview-${{ github.run_number }}.apk"
          gh release create "preview-${{ github.run_number }}" \
            "release-assets/dame-pon-pasajero-preview-${{ github.run_number }}.apk" \
            "release-assets/dame-pon-conductor-preview-${{ github.run_number }}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Dame Pon Android preview ${{ github.run_number }}" \
            --notes "APKs de prueba generados para las apps Pasajero y Conductor."